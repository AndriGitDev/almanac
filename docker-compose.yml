# Almanac — Docker Compose
#
# Basic deployment (no TLS). Good for:
#   - Local development / testing
#   - Behind an existing reverse proxy (nginx, Caddy, Cloudflare tunnel)
#   - Private networks (Tailscale, WireGuard, VPN)
#
# Quick start:
#   ALMANAC_API_KEY=your-secret docker compose up -d
#
# For production deployment with automatic TLS, use:
#   ./setup-remote.sh --host vault.example.com --tls
#
# Environment variables:
#   ALMANAC_API_KEY   - Required for auth (generate: python3 -c "import secrets; print(secrets.token_urlsafe(32))")
#   ALMANAC_PORT      - External port (default: 8745)

services:
  vault:
    build: .
    ports:
      - "${ALMANAC_PORT:-8745}:8745"
    volumes:
      - vault-data:/vault
      - vault-config:/home/almanac/.config/almanac
    environment:
      ALMANAC_VAULT_PATH: /vault
      ALMANAC_TRANSPORT: streamable-http
      ALMANAC_HOST: 0.0.0.0
      ALMANAC_PORT: "8745"
      ALMANAC_API_KEY: "${ALMANAC_API_KEY:?Set ALMANAC_API_KEY before starting}"
    restart: unless-stopped

volumes:
  vault-data:
    driver: local
  vault-config:
    driver: local
